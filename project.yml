name: Still
options:
  bundleIdPrefix: com.still
  deploymentTarget:
    iOS: "26.0"
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_CFBundleDisplayName: Still

packages:
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift
    version: 0.15.3

targets:
  Still:
    type: application
    platform: iOS
    sources:
      - path: Still
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.still.app
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Still sends gentle reminders when you miss an evening reflection."
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: SQLite
        product: SQLite

  StillMac:
    type: application
    platform: macOS
    sources:
      - path: StillMac
        excludes:
          - "**/.DS_Store"
      - path: Still/Models
        excludes:
          - "**/.DS_Store"
      - path: Still/Services/DatabaseService.swift
      - path: Still/Services/QuestionBank.swift
      - path: Still/Services/AIService.swift
      - path: Still/Utilities/Colors.swift
      - path: Still/Utilities/Typography.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.still.app.macos
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Still. All rights reserved."
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_NAME: Still
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: "YES"
    dependencies:
      - package: SQLite
        product: SQLite

  StillWatch:
    type: application
    platform: watchOS
    sources:
      - path: StillWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.still.app.watchkitapp
        INFOPLIST_FILE: StillWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
